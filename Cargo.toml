[workspace]
resolver = "3"
members = [
    "crates/fetch",
    "crates/libtailscale-sys",
    "crates/pb-core",
    "src-tauri",
    "xtask",
]
# `cargo build` / `cargo test` at the root skip the Tauri app so the core can be
# built and tested on machines without a webview toolchain.
default-members = ["crates/fetch", "crates/libtailscale-sys", "crates/pb-core", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.dependencies]
fetch = { path = "crates/fetch" }
libtailscale-sys = { path = "crates/libtailscale-sys" }
pb-core = { path = "crates/pb-core" }

anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
